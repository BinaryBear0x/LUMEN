name: Build and verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore HuePC.sln

      - name: Audit NuGet dependencies
        run: dotnet list HuePC.sln package --vulnerable --include-transitive --no-restore

      - name: Build Release
        run: dotnet build HuePC.sln --configuration Release --no-restore

      - name: Run core and persistence checks
        run: dotnet run --project HuePC.Tests\HuePC.Tests.csproj --configuration Release --no-build
